android {
    namespace = 'com.archos.mediacenter.video'
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
            enableV3Signing = true
            enableV4Signing = true
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
            enableV3Signing = true
            enableV4Signing = true
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    compileOptions {
        // needed for old Android versions when using java 17
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl = true
        buildConfig = true
        renderScript = false
    }
    compileSdk = 36
    sourceSets {
        main.java.srcDir file("../shared-updater/src")
        main {
            manifest.srcFile 'AndroidManifest.xml'
            resources.srcDirs = ['src/main/java']
            aidl.srcDirs = ['src/main/java']
            res.srcDirs = ['res', '../shared-updater/res']
            assets.srcDirs = ['assets']
        }
    }
    defaultConfig {
        applicationId = "com.meedx.localcinema.tv"
        generatedDensities = []
        minSdkVersion 23
        targetSdkVersion 35
        multiDexEnabled = true
        if (project.hasProperty('prebuiltNative')) {
            // The Windows bootstrap extracts the matching official ARMv7 engine.
            ndk { abiFilters 'armeabi-v7a' }
        }
        // below version tracks the one from F-Droid or universal package when generated with ./gradlew -Puniversal
        // this is overridden when using split apk and normal split apk generation or oneapk amazon generation
        // amazon apk is generated with ./gradlew -Poneapk
        versionCode = 17
        versionName = '1.0.0-beta.17'
        //archivesBaseName = "" + applicationId + "-" + versionCode + "-" + versionName
        project.extensions.getByType(BasePluginExtension).archivesName.set("Local-Cinema-" + versionCode + "-" + versionName)
        def archivesNameValue = project.extensions.getByType(BasePluginExtension).archivesName.get()
        println("defaultConfig archivesBaseName : " + archivesNameValue)
        println("defaultConfig versionName : " + versionName)
        println("defaultConfig versionCode : " + versionCode)
        if (keystorePropertiesFile.exists()) signingConfig = signingConfigs.release
        if (project.hasProperty("sponsor")) {
            buildConfigField "boolean", "ENABLE_SPONSOR", "true"
        } else {
            buildConfigField "boolean", "ENABLE_SPONSOR", "false"
        }
        if (project.hasProperty("adultScrape")) {
            buildConfigField "boolean", "ADULT_SCRAPE", "true"
        } else {
            buildConfigField "boolean", "ADULT_SCRAPE", "false"
        }
        buildConfigField "boolean", "ENABLE_BUG_REPORT", "false"
        buildConfigField "String", "SENTRY_DSN", '""'
        resValue "string", "VERSION_NAME", versionName
        resValue "string", "APPLICATION_ID", applicationId
        buildConfigField "String", "APP_NAME", "\"Local Cinema\""
        resValue "string", "APP_INFO", "Local Cinema TV v" + versionName + " (" + applicationId + ")"
        resValue "string", "APP_VERSION", versionName
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    splits {
        abi {
            enable = true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            if (project.hasProperty("universal")) {
                // universal if for fdroid now with specific version(Name|Code) and oneapk for amazon
                enable = false
                universalApk = true
            } else if (project.hasProperty("oneapk")) {
                // universal if for fdroid now with specific version(Name|Code) and oneapk for amazon
                enable = true
                universalApk = true
            } else {
                // disable splits for bundle builds, enable for APK builds
                enable = !gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains("bundle") }
                universalApk = false
            }
        }
    }
    flavorDimensions "amazon"
    productFlavors {
        amazon {
            dimension "amazon"
        }
        noamazon {
            dimension "amazon"
        }
        manageexternalstorage {
            dimension "amazon"
        }
    }
    aaptOptions {
        additionalParameters '--no-version-vectors'
    }
    buildTypes {
        println("buildTypes archivesBaseName : " + archivesNameValue)
        debug {
            buildConfigField 'boolean', 'VERIFY_RELEASE_SIGNER', 'false'
        }
        release {
            buildConfigField 'boolean', 'VERIFY_RELEASE_SIGNER', providers.gradleProperty('localCinemaOfficialSigner').map { it.toBoolean() }.orElse(keystorePropertiesFile.exists()).get().toString()
            if (!keystorePropertiesFile.exists()) signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/services/**',
                         'com/**',
                         'jcifs2/**',
                         'kotlin/**',
                         'okhttp3/**',
                         'org/**',
                         "**/libc++_shared.so"
                        ]
                         
            pickFirsts += ['lib/x86/libnvpnativehelper.so',
                           'lib/x86_64/libnvpnativehelper.so',
                           'lib/armeabi-v7a/libnvpnativehelper.so',
                           'lib/arm64-v8a/libnvpnativehelper.so',
                           ]
        }
        resources {
            excludes += ['META-INF/*.kotlin_module',
                         'META-INF/*.version',
                         'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE',
                         'META-INF/NOTICE',
                         'META-INF/LICENSE.txt',
                         'META-INF/LICENSE.md',
                         'META-INF/NOTICE.txt',
                         'META-INF/NOTICE.md',
                         'META-INF/beans.xml',
                         'META-INF/maven',
                         'META-INF/services/**',
                         'README',
                         'com/**',
                         'jcifs2/**',
                         'kotlin/**',
                         'okhttp3/**',
                         'org/**',
                         '**/*.txt',
                         '**/*.xml',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                         'META-INF/versions/15/OSGI-INF/MANIFEST.MF',
                         'META-INF/versions/11/OSGI-INF/MANIFEST.MF']
        }
    }
    lint {
        abortOnError false // Set to false to only fail on fatal issues
        disable 'all'
        enable 'NewApi'
        fatal 'NewApi'
        warning 'MissingSuperCall' // Downgrade MissingSuperCall to a warning
        disable 'MissingTranslation'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.all { output ->
            def api = defaultConfig.minSdkVersion.apiLevel
            if (project.hasProperty("universal")) { // only one apk
                outputFileName = outputFileName.replace("-release", "-universal-release")
            }
            outputFileName = outputFileName.replace("-noamazon-", "-")
                    .replace("-manageexternalstorage-", "-")
            variant.getAssembleProvider().configure() {
                // Run lint during assembly to ensure the build fails on errors like NewApi
                it.dependsOn("lint" + variant.name.capitalize())
                it.doLast {
                    println("generated: " + outputFileName + " (" + versionName + ", " + versionCode + ")");
                }
            }
        }
    }

    dependenciesInfo {
        if (project.hasProperty("universal")) {
            // universal if for fdroid now with specific version(Name|Code) and oneapk for amazon
            includeInApk = false
            includeInBundle = false
        }
    }
    buildFeatures {
	aidl = true
    }
}

dependencies {
    def torrentVersion = '2.1.0-38'
    implementation "org.libtorrent4j:libtorrent4j:${torrentVersion}"
    ['arm', 'arm64', 'x86', 'x86_64'].each { abi ->
        runtimeOnly "org.libtorrent4j:libtorrent4j-android-${abi}:${torrentVersion}"
    }
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation project(':FileCoreLibrary')
    implementation project(':MediaLib')
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    // needed for old Android versions when using java 17
    // NewPipe uses the Charset overloads of URL encoder and decoder on pre-33 devices.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.legacy:legacy-support-core-utils:1.0.0'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation ('com.github.ksoichiro:android-observablescrollview:1.6.0') {
        exclude group: 'com.android.support', module: 'recyclerview-v7'
        exclude group: 'com.android.support', module: 'support-v4'
    }
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.leanback:leanback-preference:1.2.0'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'io.sentry:sentry-android:8.31.0'
    implementation 'io.sentry:sentry:8.31.0'
}

configurations { // try to exclude device specific libraries interfering
    configureEach {
        exclude group: 'jcifs', module: 'jcifs' // try to avoid conflict with jcifs-ng on Konka Android TV 2861
    }
}

// to avoid duplicate classes
configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
